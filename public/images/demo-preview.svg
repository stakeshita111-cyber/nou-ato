<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#044e39" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="emeraldBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="stackShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="stackShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Title & Header -->
  <g transform="translate(60, 42)">
    <rect width="46" height="46" rx="14" fill="#10b981" />
    <text x="23" y="32" font-family="'Noto Sans JP', sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">🌱</text>
    <text x="60" y="33" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-0.5">NOU-ATO (のうあと)</text>
    <text x="390" y="32" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="700" fill="#a7f3d0">体験農業経営支援プラットフォーム</text>
    <g transform="translate(850, 6)">
      <rect width="230" height="28" rx="14" fill="#065f46" stroke="#34d399" stroke-width="1" />
      <text x="115" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ecfdf5" text-anchor="middle">✓ 103 Tests Passed • Coverage 88%</text>
    </g>
  </g>

  <!-- Panel 1: 受講生ポータル (左) -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="330" height="470" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <!-- Header -->
    <rect width="330" height="48" rx="20" fill="#047857" />
    <rect y="28" width="330" height="20" fill="#047857" />
    <text x="20" y="31" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">📱 受講生ポータル (/student)</text>
    <circle cx="300" cy="24" r="6" fill="#34d399" />

    <!-- 1. スリム畝カード (マイファーム) -->
    <g transform="translate(20, 62)">
      <rect width="290" height="64" rx="12" fill="#ecfdf5" stroke="#a7f3d0" />
      <div xmlns="http://www.w3.org/1999/xhtml"></div>
      <text x="15" y="24" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#065f46">畝-1 🍅 ミニトマト</text>
      <text x="15" y="42" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#047857">進捗率: 75% • 定植から45日目</text>
      <rect x="15" y="48" width="260" height="6" rx="3" fill="#d1fae5" />
      <rect x="15" y="48" width="195" height="6" rx="3" fill="#059669" />
    </g>

    <!-- 2. カードスタック & 循環ループ (タスクスライダー) -->
    <g transform="translate(20, 140)">
      <text x="4" y="14" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#1e293b">📋 タスク (カードスタック循環)</text>
      
      <!-- Back Card 2 (奥のチラ見えカード) -->
      <g transform="translate(16, 24) scale(0.89)" opacity="0.5" filter="url(#stackShadow1)">
        <rect width="290" height="100" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      </g>
      <!-- Back Card 1 (中間カード) -->
      <g transform="translate(8, 29) scale(0.95)" opacity="0.8" filter="url(#stackShadow1)">
        <rect width="290" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="15" y="30" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#64748b">次タスク: 追肥（化成肥料）の施用</text>
      </g>
      <!-- Front Card (最前面カード) -->
      <g transform="translate(0, 36)" filter="url(#stackShadow2)">
        <rect width="290" height="106" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2" />
        <rect x="14" y="14" width="70" height="18" rx="6" fill="#fef3c7" />
        <text x="49" y="27" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">写真報告必須</text>
        <text x="92" y="27" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">難易度: ★★☆</text>
        <text x="14" y="52" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">わき芽かき＆支柱誘引作業</text>
        <text x="14" y="70" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">第1花房の下から出る勢いのある芽を…</text>
        <!-- Loop Swipe Hint -->
        <g transform="translate(14, 80)">
          <rect width="262" height="18" rx="5" fill="#f0fdf4" />
          <text x="131" y="13" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="bold" fill="#059669" text-anchor="middle">⇆ フリックスライドで奥のカードへ循環</text>
        </g>
      </g>
    </g>

    <!-- 3. 成長スキルボード (3D回転バッジ & テキスト詳細) -->
    <g transform="translate(20, 305)">
      <text x="4" y="14" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#1e293b">🏆 スキルボード (3D回転コインバッジ)</text>
      
      <!-- Badges Grid with 3D Coin Rotation look -->
      <g transform="translate(0, 24)">
        <!-- Badge 1: Gold 3D Coin -->
        <g transform="translate(10, 0)">
          <circle cx="24" cy="24" r="22" fill="url(#goldCoinGrad)" stroke="#b45309" stroke-width="1.5" />
          <circle cx="24" cy="24" r="17" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="3,2" />
          <text x="24" y="31" font-family="'Noto Sans JP', sans-serif" font-size="16" text-anchor="middle">🌱</text>
        </g>
        <!-- Badge 2: Rotating Coin Edge Effect -->
        <g transform="translate(70, 0)">
          <ellipse cx="24" cy="24" rx="14" ry="22" fill="url(#emeraldBadgeGrad)" stroke="#047857" stroke-width="1.5" />
          <text x="24" y="30" font-family="'Noto Sans JP', sans-serif" font-size="14" text-anchor="middle">🍅</text>
        </g>
        <!-- Badge 3 -->
        <g transform="translate(130, 0)">
          <circle cx="24" cy="24" r="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
          <text x="24" y="31" font-family="'Noto Sans JP', sans-serif" font-size="16" text-anchor="middle">💧</text>
        </g>
        <!-- Badge 4 -->
        <g transform="translate(190, 0)">
          <circle cx="24" cy="24" r="22" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5" />
          <text x="24" y="31" font-family="'Noto Sans JP', sans-serif" font-size="16" text-anchor="middle">✂️</text>
        </g>
        <!-- Badge 5 -->
        <g transform="translate(250, 0)">
          <circle cx="20" cy="24" r="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
          <text x="20" y="29" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">🔒</text>
        </g>
      </g>

      <!-- Badge Text-Only Detail Card (タップ時表示) -->
      <g transform="translate(0, 82)">
        <rect width="290" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="12" y="20" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#0f172a">土作りの達人 バッジ</text>
        <text x="12" y="38" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#475569">クリアしたタスク: 堆肥・元肥のすき込み, 畝立て整形</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: 講師ダッシュボード (中央) -->
  <g transform="translate(435, 110)" filter="url(#shadow)">
    <rect width="330" height="470" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <rect width="330" height="48" rx="20" fill="#1e3a8a" />
    <rect y="28" width="330" height="20" fill="#1e3a8a" />
    <text x="20" y="31" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">👨‍🌾 講師ダッシュボード (/teacher)</text>

    <!-- Canvas Preview (スリム化された畝カード) -->
    <g transform="translate(20, 62)">
      <rect width="290" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4" />
      <text x="14" y="22" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#334155">🗺️ 農地キャンバス (D&amp;D 畝配置)</text>
      
      <!-- Bed 1 (スリムカード: 畝ナンバーと作物名に集約) -->
      <g transform="translate(12, 32)">
        <rect width="128" height="58" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
        <text x="10" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#15803d">畝-1 🍅 ミニトマト</text>
        <text x="10" y="40" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#166534">受講生: 竹下翔 (75%)</text>
      </g>

      <!-- Bed 2 -->
      <g transform="translate(150, 32)">
        <rect width="128" height="58" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5" />
        <text x="10" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#854d0e">畝-2 🥒 キュウリ</text>
        <text x="10" y="40" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#713f12">受講生: 佐藤花子 (40%)</text>
      </g>

      <!-- Bed 3 -->
      <g transform="translate(12, 102)">
        <rect width="128" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="10" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#475569">畝-3 🍆 ナス</text>
        <text x="10" y="40" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">空き区画 (受講生募集)</text>
      </g>

      <!-- Bed 4 -->
      <g transform="translate(150, 102)">
        <rect width="128" height="58" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5" />
        <text x="10" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">畝-4 🥔 ジャガイモ</text>
        <text x="10" y="40" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#4c1d95">受講生: 田中太郎 (90%)</text>
      </g>
    </g>

    <!-- 一括アナウンス配信 -->
    <g transform="translate(20, 258)">
      <rect width="290" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="14" y="24" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#1e40af">📢 一括アナウンス配信</text>
      <text x="14" y="46" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#1e3a8a">「明日の午前は雨予報のため、講習会は…</text>
      <text x="14" y="62" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#1e3a8a">ビニールハウス内で実施します。」</text>
      <rect x="14" y="70" width="100" height="16" rx="4" fill="#2563eb" />
      <text x="64" y="82" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">全受講生へ即時配信</text>
    </g>

    <!-- 受講生マネジメント -->
    <g transform="translate(20, 362)">
      <rect width="290" height="88" rx="12" fill="#fdf2f8" stroke="#fbcfe8" />
      <text x="14" y="22" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#9d174d">👥 受講生マネジメント</text>
      <text x="14" y="42" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#be185d">登録生徒: 12名 • 未読日誌: 2件</text>
      <text x="14" y="58" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#047857">招待リンク発行 &amp; 退会連動トリガー完備</text>
      <text x="14" y="74" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#9d174d">※個別タスク割当・進捗グラフ同期</text>
    </g>
  </g>

  <!-- Panel 3: AI しるべぇ (右) -->
  <g transform="translate(810, 110)" filter="url(#shadow)">
    <rect width="330" height="470" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <rect width="330" height="48" rx="20" fill="#0f766e" />
    <rect y="28" width="330" height="20" fill="#0f766e" />
    <text x="20" y="31" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🤖 AIしるべぇ (農園RAG相談)</text>

    <!-- Ticket Counter -->
    <g transform="translate(20, 62)">
      <rect width="290" height="34" rx="10" fill="#ccfbf1" stroke="#99f6e4" />
      <text x="14" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#115e59">🎫 本日の相談チケット: 残り 2 / 3 回 (午前0時復活)</text>
    </g>

    <!-- Chat Bubbles -->
    <g transform="translate(20, 108)">
      <!-- Student bubble (PII保護済み) -->
      <rect x="50" y="0" width="240" height="44" rx="12" fill="#d1fae5" />
      <text x="62" y="19" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#065f46">「葉が黄色くなってきました。大丈夫？」</text>
      <text x="62" y="34" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#059669">竹下翔 • 10:14 (PIIサニタイズ済み)</text>

      <!-- AI RAG bubble -->
      <rect x="0" y="52" width="290" height="152" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="14" y="22" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#0f766e">🌱 AIしるべぇ (Gemini 1.5 + 農園ナレッジ):</text>
      <text x="14" y="42" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#334155">「一番下の古い葉であれば自然な黄変</text>
      <text x="14" y="60" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#334155">ですので切り取って風通しを良くして</text>
      <text x="14" y="78" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#334155">あげてくださいね！全体に広がっている</text>
      <text x="14" y="96" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#334155">場合はチッソ追肥を検討しましょう。」</text>
      
      <!-- Source citation -->
      <rect x="14" y="112" width="262" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="22" y="129" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#15803d">📚 参照: 講師承認済みナレッジ (自然栽培Q&amp;A)</text>
    </g>

    <!-- プライバシー共有許可トグル (Yes/No) -->
    <g transform="translate(20, 326)">
      <rect width="290" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="22" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#475569">農園ナレッジ共有許可:</text>
      <!-- Yes Button (Active) -->
      <rect x="150" y="12" width="60" height="28" rx="6" fill="#059669" />
      <text x="180" y="30" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Yes ✓</text>
      <!-- No Button -->
      <rect x="218" y="12" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="248" y="30" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">No</text>
      <text x="12" y="42" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#94a3b8">※生徒自身でいつでも切替可能</text>
    </g>

    <!-- Bottom input box -->
    <g transform="translate(20, 396)">
      <rect width="290" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="14" y="26" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#94a3b8">質問を入力... (安全トピック照合)</text>
      <circle cx="264" cy="21" r="14" fill="#0d9488" />
      <text x="264" y="26" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">→</text>
    </g>
  </g>
</svg>
