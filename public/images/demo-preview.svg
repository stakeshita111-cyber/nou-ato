<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Title & Header -->
  <g transform="translate(60, 50)">
    <rect width="48" height="48" rx="14" fill="#10b981" />
    <text x="24" y="33" font-family="'Noto Sans JP', sans-serif" font-size="26" text-anchor="middle" fill="#ffffff">🌱</text>
    <text x="64" y="34" font-family="'Inter', 'Noto Sans JP', sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">NOU-ATO (のうあと)</text>
    <text x="420" y="32" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">体験農業経営支援プラットフォーム</text>
  </g>

  <!-- Panel 1: 受講生ポータル (左) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="330" height="450" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <!-- Header -->
    <rect width="330" height="50" rx="20" fill="#047857" />
    <rect y="30" width="330" height="20" fill="#047857" />
    <text x="20" y="32" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">📱 受講生ポータル (/student)</text>

    <!-- Content Items -->
    <g transform="translate(20, 70)">
      <rect width="290" height="85" rx="12" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="15" y="28" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#065f46">🍅 マイファーム: A-1畝 (ミニトマト)</text>
      <text x="15" y="50" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#047857">進捗率: 75% • 定植から45日目</text>
      <!-- Progress Bar -->
      <rect x="15" y="60" width="260" height="8" rx="4" fill="#d1fae5" />
      <rect x="15" y="60" width="195" height="8" rx="4" fill="#059669" />
    </g>

    <g transform="translate(20, 170)">
      <rect width="290" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="28" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">📋 本日の推奨タスク</text>
      <text x="15" y="50" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#64748b">【重要】わき芽かき＆支柱誘引作業</text>
      <rect x="15" y="58" width="80" height="18" rx="6" fill="#fef3c7" />
      <text x="55" y="71" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">写真報告必須</text>
    </g>

    <g transform="translate(20, 270)">
      <rect width="290" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" />
      <text x="15" y="28" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#1e293b">📖 農園交換日記 (最新)</text>
      <rect x="15" y="42" width="260" height="42" rx="8" fill="#f8fafc" />
      <text x="25" y="60" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#475569">生徒:「一番果がつきました！追肥は？」</text>
      <text x="25" y="75" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#94a3b8">2026/09/25 10:15</text>
      <rect x="15" y="92" width="260" height="45" rx="8" fill="#eff6ff" />
      <text x="25" y="110" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#1e40af">講師:「元気に育ってますね！株元に…」</text>
      <text x="25" y="125" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#3b82f6">返信済み ✓</text>
    </g>
  </g>

  <!-- Panel 2: 講師ダッシュボード (中央) -->
  <g transform="translate(435, 120)" filter="url(#shadow)">
    <rect width="330" height="450" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <rect width="330" height="50" rx="20" fill="#1e3a8a" />
    <rect y="30" width="330" height="20" fill="#1e3a8a" />
    <text x="20" y="32" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">👨‍🌾 講師ダッシュボード (/teacher)</text>

    <!-- Canvas Preview -->
    <g transform="translate(20, 70)">
      <rect width="290" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4" />
      <text x="15" y="24" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#334155">🗺️ 農地キャンバス (D&amp;D 畝配置)</text>
      
      <!-- Bed 1 -->
      <rect x="15" y="35" width="125" height="55" rx="8" fill="#dcfce7" stroke="#86efac" />
      <text x="25" y="55" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#15803d">畝-1 🍅 竹下翔</text>
      <text x="25" y="73" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#166534">進捗: 75% [順調]</text>

      <!-- Bed 2 -->
      <rect x="150" y="35" width="125" height="55" rx="8" fill="#fef9c3" stroke="#fde047" />
      <text x="160" y="55" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#854d0e">畝-2 🥒 佐藤花子</text>
      <text x="160" y="73" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#713f12">進捗: 40% [作業中]</text>

      <!-- Bed 3 -->
      <rect x="15" y="100" width="125" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="25" y="120" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#475569">畝-3 🍆 空き区画</text>
      <text x="25" y="138" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#64748b">受講生募集中</text>

      <!-- Bed 4 -->
      <rect x="150" y="100" width="125" height="55" rx="8" fill="#ede9fe" stroke="#ddd6fe" />
      <text x="160" y="120" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">畝-4 🥔 田中太郎</text>
      <text x="160" y="138" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#4c1d95">進捗: 90% [収穫間近]</text>
    </g>

    <g transform="translate(20, 260)">
      <rect width="290" height="75" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="15" y="24" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#1e40af">📢 一括アナウンス配信</text>
      <text x="15" y="44" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#3b82f6">「明日の午前は雨予報のため、講習会は…」</text>
      <rect x="15" y="52" width="100" height="16" rx="4" fill="#2563eb" />
      <text x="65" y="64" font-family="'Noto Sans JP', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">全受講生へ即時配信</text>
    </g>

    <g transform="translate(20, 350)">
      <rect width="290" height="75" rx="12" fill="#fdf2f8" stroke="#fbcfe8" />
      <text x="15" y="24" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#9d174d">👥 受講生マネジメント</text>
      <text x="15" y="44" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#be185d">登録受講生: 12名 • 未読日誌: 2件</text>
      <text x="15" y="60" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#047857">招待リンク発行 &amp; 退会連動トリガー完備</text>
    </g>
  </g>

  <!-- Panel 3: AI しるべぇ (右) -->
  <g transform="translate(810, 120)" filter="url(#shadow)">
    <rect width="330" height="450" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" />
    <rect width="330" height="50" rx="20" fill="#0f766e" />
    <rect y="30" width="330" height="20" fill="#0f766e" />
    <text x="20" y="32" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🤖 AIしるべぇ (農園RAG相談)</text>

    <!-- Ticket Counter -->
    <g transform="translate(20, 70)">
      <rect width="290" height="35" rx="10" fill="#ccfbf1" stroke="#99f6e4" />
      <text x="15" y="22" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#115e59">🎫 本日の相談チケット: 残り 2 / 3 回</text>
    </g>

    <!-- Chat Bubbles -->
    <g transform="translate(20, 120)">
      <!-- Student bubble -->
      <rect x="70" y="0" width="220" height="45" rx="12" fill="#d1fae5" />
      <text x="82" y="20" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#065f46">「葉が少し黄色くなってきました。大丈夫でしょうか？」</text>
      <text x="82" y="36" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#059669">竹下翔 • 10:14</text>

      <!-- AI RAG bubble -->
      <rect x="0" y="60" width="290" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="15" y="24" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="#0f766e">🌱 AIしるべぇ (Gemini 1.5 + 農園ナレッジ):</text>
      <text x="15" y="45" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#334155">「一番下の古い葉であれば自然な黄変</text>
      <text x="15" y="63" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#334155">ですので切り取って風通しを良くして</text>
      <text x="15" y="81" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#334155">あげてくださいね！全体に広がっている</text>
      <text x="15" y="99" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#334155">場合はチッソ追肥を検討しましょう。」</text>
      
      <!-- Source citation -->
      <rect x="15" y="112" width="260" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="25" y="129" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#15803d">📚 参照: 講師承認済みナレッジ (過去日誌Q&amp;A)</text>
    </g>

    <!-- Bottom prompt box -->
    <g transform="translate(20, 390)">
      <rect width="290" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="15" y="25" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#94a3b8">質問を入力... (リアルタイムFAQ照合)</text>
      <circle cx="265" cy="20" r="14" fill="#0d9488" />
      <text x="265" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">→</text>
    </g>
  </g>
</svg>
