name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Clean Code & Secrets Gate
        run: npm run check:clean

      - name: Run Database & Schema Security Gate
        run: npm run check:db

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase Migrations with Database Linter
        run: supabase db lint --level error

      - name: Strict Any Check on Changed Files (PR Only)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking changed TypeScript files for any usage..."
            echo "$CHANGED_FILES"
            npx eslint $CHANGED_FILES --rule '@typescript-eslint/no-explicit-any: error' --max-warnings 0
          else
            echo "No TypeScript files modified in this PR."
          fi

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Prettier Format Check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Vitest Suite
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-project.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key-for-ci-build' }}

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock-project.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key-for-ci-build' }}
